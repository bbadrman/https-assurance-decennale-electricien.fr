nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin:
            - '^https?://(www\.)?assurance-decennale-electricien\.fr$'
            - '^https?://localhost(:[0-9]+)?$'
            - '^https?://decennale-electricien\.ddev\.site(:[0-9]+)?$'
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/': null